server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.html;

    location ~ /\.(?!well-known/) {
        deny all;
        return 404;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ^~ /vendor/ {
        deny all;
        return 404;
    }

    location ^~ /bootstrap/ {
        deny all;
        return 404;
    }

    location ~* ^/(?:composer\.(?:json|lock)|artisan|\.env(?:\..*)?|package(?:-lock)?\.json|vite\.config\.[^/]+|tsconfig[^/]*)$ {
        deny all;
        return 404;
    }

    # Local process check only. Coolify's public check can move to /api/health
    # after Supabase is connected; that route queries the database.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $vividworks_https;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php-fpm.sock;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.php$ {
        deny all;
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
