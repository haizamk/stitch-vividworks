user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format vividworks '$remote_addr "$request" $status $body_bytes_sent';
    access_log /dev/stdout vividworks;

    sendfile on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 32k;

    map $http_x_forwarded_proto $vividworks_https {
        default off;
        https on;
    }

    include /etc/nginx/conf.d/*.conf;
}
