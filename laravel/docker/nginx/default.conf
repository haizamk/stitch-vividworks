server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;

    # Loopback liveness only. Coolify's checker is not 127.0.0.1, so it uses /api/health.
    location = /fpm-ping {
        allow 127.0.0.1;
        deny all;
        access_log off;

        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param REQUEST_URI /fpm-ping;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ^~ /vendor/ {
        deny all;
    }

    location ^~ /storage/ {
        deny all;
    }

    location ^~ /bootstrap/ {
        deny all;
    }

    location ~ \.php$ {
        deny all;
    }

    location ^~ /api/ {
        location ~ /\. {
            deny all;
        }

        try_files $uri @laravel;
    }

    location @laravel {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $vividworks_https;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_hide_header X-Powered-By;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}
