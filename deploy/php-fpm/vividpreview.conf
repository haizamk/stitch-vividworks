; Dedicated pool for the Vividworks Laravel preview.
; This file is read only by php8.5-fpm-vividpreview.service.
; It is not included by the global PHP-FPM master.
; Stop it with: systemctl stop php8.5-fpm-vividpreview
; That command does not reload or restart php8.5-fpm.service.

[vividpreview]
listen = /run/php/php8.5-fpm-vividpreview.sock
listen.owner = vividpreview
listen.group = www-data
listen.mode = 0660

user = vividpreview
group = vividpreview

pm = ondemand
pm.max_children = 4
pm.max_requests = 500
pm.process_idle_timeout = 10s

clear_env = yes
catch_workers_output = no
security.limit_extensions = .php

php_admin_flag[expose_php] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/vividpreview/laravel-app/shared/storage/logs/php-fpm-worker.log
php_admin_value[upload_tmp_dir] = /home/vividpreview/tmp
php_admin_value[session.save_path] = /home/vividpreview/tmp
php_admin_value[open_basedir] = /home/vividpreview/laravel-app:/home/vividpreview/tmp:/tmp:/usr/share:/usr/lib/php:/dev/urandom
