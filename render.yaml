# Blueprint for the vividworks.my marketing site.
# Web service plus Postgres. Apply it from a GitHub, GitLab, or Bitbucket repository.
# Smallest current plans. Region is Singapore for visitors in Malaysia.

services:
  - type: web
    name: vividworks-my
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: vividworks-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: vividworks-db
    databaseName: vividworks
    plan: free
    region: singapore
    postgresMajorVersion: "16"
