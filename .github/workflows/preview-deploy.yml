name: Deploy preview

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: vividpreview
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to preview.vividworks.my
        env:
          SSH_KEY: ${{ secrets.VIVIDPREVIEW_SSH_KEY }}
          HOST: 51.79.159.241
        run: |
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp .github/preview_known_hosts ~/.ssh/known_hosts
          tar -czf - \
            --exclude node_modules \
            --exclude dist \
            --exclude .git \
            --exclude .env \
            . | ssh -T -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "ubuntu@${HOST}"
